name: Sync Fusion mirror

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      catalog:
        description: 'Catalog year (blank checks current)'
        required: false
        type: string
      slug:
        description: 'Plugin slug (blank checks all)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fusion-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Mirror eligible releases
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CATALOG: ${{ inputs.catalog }}
          INPUT_SLUG: ${{ inputs.slug }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [[ -n "$INPUT_CATALOG" ]]; then args+=(--catalog "$INPUT_CATALOG"); fi
          if [[ -n "$INPUT_SLUG" ]]; then args+=(--slug "$INPUT_SLUG"); fi
          if [[ "$EVENT_NAME" == schedule && "$(date -u +%u)" == 7 ]]; then args+=(--include-supported); fi
          python3 scripts/sync-mirror.py "${args[@]}"
      - name: Publish mirror index
        if: always()
        run: |
          if git diff --quiet -- mirror-index.json fusion-index.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mirror-index.json fusion-index.json
          git commit -m 'Refresh Fusion mirror index'
          git pull --rebase origin main
          git push origin HEAD:main
